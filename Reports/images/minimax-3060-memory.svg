<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs><style>text{font-family:'Segoe UI',sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.box{rx:18;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#596780"/></marker></defs>
<rect width="1200" height="520" fill="#f5f7fb" rx="24"/><text x="48" y="58" class="title">MiniMax H3をRTX 3060 12GBで動かすときのモデル配置</text>
<rect x="55" y="110" width="265" height="300" class="box" fill="#e8f1ff" stroke="#6a92d6"/><text x="82" y="150" class="head">RTX 3060</text><text x="82" y="180" class="body">実利用可能VRAM 約11.6 GiB</text><rect x="82" y="207" width="210" height="58" rx="10" fill="#6795e5"/><text x="98" y="243" font-size="18" fill="white">GPU上で一部を実行</text><text x="82" y="305" class="body">全モデルを同時に載せず</text><text x="82" y="333" class="body">必要な重みを入れ替える</text><text x="82" y="375" class="small">解像度・フレーム数が増えると負荷増</text>
<path d="M337 260H405" stroke="#596780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="430" y="110" width="320" height="300" class="box" fill="#fff4df" stroke="#d7a449"/><text x="460" y="150" class="head">システムRAM + SSD</text><text x="460" y="190" class="body">重みを置き、GPUへ順次転送</text><rect x="460" y="220" width="260" height="62" rx="10" fill="#f0c66e"/><text x="480" y="258" font-size="18">INT8 DiT 約19.5 GiB</text><rect x="460" y="295" width="260" height="62" rx="10" fill="#f4d998"/><text x="480" y="333" font-size="18">テキストエンコーダー 約25 GiB</text><text x="460" y="385" class="small">大容量RAM・空きディスクが重要</text>
<path d="M768 260H836" stroke="#596780" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="860" y="110" width="285" height="300" class="box" fill="#e7f6ee" stroke="#62a27c"/><text x="890" y="150" class="head">ComfyUI生成</text><text x="890" y="195" class="body">低解像度で試作</text><text x="890" y="232" class="body">Turbo LoRAで少ステップ</text><text x="890" y="269" class="body">短尺で動作確認</text><text x="890" y="306" class="body">必要な箇所だけ本番生成</text><text x="890" y="366" class="small">速さは転送・GPU・設定で変化</text>
<text x="55" y="470" class="small">注意: RTX 3060でのローカル実行例はありますが、モデル一式をVRAMに収める方法ではありません。測定値は構成ごとの参考値です。</text></svg>
