<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs><style>text{font-family:'Segoe UI',sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.note{font-size:15px}.box{rx:18;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#596780"/></marker></defs>
<rect width="1200" height="500" fill="#f5f7fb" rx="24"/><text x="48" y="58" class="title">長尺化の考え方: クリップを分割し、前の状態を次へ渡す</text>
<rect x="55" y="130" width="300" height="170" class="box" fill="#e8f1ff" stroke="#6a92d6"/><text x="85" y="175" class="head">チャンク A</text><text x="85" y="220" class="body">人物・動作・音声を生成</text><text x="85" y="260" class="note">末尾の映像/音声latentを保存</text>
<path d="M365 215H445" stroke="#596780" stroke-width="4" marker-end="url(#arrow)"/><text x="367" y="185" class="note">参照・継続</text>
<rect x="465" y="130" width="300" height="170" class="box" fill="#fff4df" stroke="#d7a449"/><text x="495" y="175" class="head">チャンク B</text><text x="495" y="220" class="body">前区間をガイドに続き生成</text><text x="495" y="260" class="note">音声を生成継続 or 元音源保持</text>
<path d="M775 215H855" stroke="#596780" stroke-width="4" marker-end="url(#arrow)"/><text x="778" y="185" class="note">必要分だけ反復</text>
<rect x="875" y="130" width="270" height="170" class="box" fill="#e7f6ee" stroke="#62a27c"/><text x="905" y="175" class="head">編集・確認</text><text x="905" y="220" class="body">境界の映像と音声を確認</text><text x="905" y="260" class="note">破綻した区間だけ再生成</text>
<rect x="55" y="350" width="1090" height="75" rx="14" fill="#fde9e7" stroke="#d17b70" stroke-width="2"/><text x="80" y="382" class="body">限界: チャンク境界で人物・背景・動作が漂移したり、台詞・音楽がずれたりすることがあります。</text><text x="80" y="409" class="note">連続性を完全保証する仕組みではありません。ワークフローとComfyUIコアの互換性も確認してください。</text></svg>
